name: "Lab Content Creation or Update"
description: "Submit or update lab materials, data files, and instructions for the workshop."
title: "Lab Update: [Insert Lab Title or Topic here]"
labels: ["lab-update", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### Lab Materials Update
        Use this form to add a new lab or update existing lab materials, code, or documentation. 
        An automated pull request will be generated upon submission.

        **Note:** If the lab is hosted externally, you only need to provide a link to the lab that will appear on the schedule page of the site. Provide the link in the section "Master Lab Archive (.zip, .tar.gz) or External upload"

  - type: markdown
    attributes:
      value: |
        ### File Attachments & Uploads

        Please ensure any uploaded files through this issue template use a GitHub [accepted](https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/attaching-files) format. 

        * **Unsupported Formats:** If your file type is not directly accepted, please **zip the archive (.zip)** before attaching it to this issue.
        Alternatively, if the file is already on GitHub, you can directly provide a link to the 'raw' file.
        For example, if you wanted to upload the R file contained here `https://github.com/trayc7/MidwestPhylo2019/blob/master/docs/class/diversification/1.general_diversification.R`, you would add a line in the text box like this `[myfile.R](https://raw.githubusercontent.com/trayc7/MidwestPhylo2019/refs/heads/master/docs/class/diversification/1.general_diversification.R)`.

        * **File Sizes:** If using the using direct upload or drag and drop, only files of 25MB are accepted. Either compress files, upload them elsewhere and provide a direct download link (e.g., as above), or use git from the terminal to add the desired file to the PR created from this issue.
  
  - type: dropdown
    id: lab_select
    attributes:
      label: "Select Lab to Update (or choose New)"
      description: "Choose an existing lab to modify, or select New Lab to create one."
      options:
        - "-- New Lab --"
        - "intro-computer-lab: Computer introduction"
        - "alignment-lab: Sequence alignment"
        - "iqtree-lab: IQ-TREE"
        - "revbayes-gene-trees: RevBayes gene trees"
        - "divergence-time-lab: Divergence time estimation"
        - "paup-session: PAUP*"
        - "svdquartets-tutorial: Species tree estimation with SVDQuartets"
        - "network-models-tutorial: Phylogenetic network models"
        - "migrate-tutorial: Migrate"
        - "machine-learning-lab: Machine learning"
        - "paml-lab: PAML"
        - "paml-advanced-resources: PAML advanced resources"
        - "tree-updating: Tree updating"
        - "tree-comparison: Tree comparison"
        - "open-lab: Open lab / project time"

  - type: input
    id: lab_title
    attributes:
      label: "Lab Title"
      description: "Leave Blank to keep the lab name the same. Required if creating a new lab, or if you want to rename the current one."
      placeholder: "e.g., Introduction to PhyloNetworks"
    validations:
      required: false

  - type: dropdown
    id: lecturer
    attributes:
      label: "Responsible Faculty / Author"
      description: "Name of the faculty member or instructor leading this lab."
      options: 
        - "Peter Beerli : peter-beerli"
        - "Joseph Bielawski : joseph-bielawski"
        - "Jeremy Brown : jeremy-brown"
        - "Belinda Chang : belinda-chang"
        - "Scott Edwards : scott-edwards"
        - "Laura Eme : laura-eme"
        - "Mandev Gill : mandev-gill"
        - "Tracy Heath : tracy-heath"
        - "Lacey Knowles : lacey-knowles"
        - "Laura Kubatko : laura-kubatko"
        - "Emily Jane McTavish : emily-jane-mctavish"
        - "Corrie Moreau : corrie-moreau"
        - "Claudia Solís-Lemus : claudia-solis-lemus"
        - "Megan Smith : megan-smith"
        - "David Swofford : david-swofford"
        - "Rosana Zenil-Ferguson : rosana-zenil-ferguson"
        - "Joshua Justison : joshua-justison"
        - "Analisa Milkey : analisa-milkey"
        - "Solomon McShea : solomon-mcshea"
        - "Thao Nguyen : thao-nguyen"
        - "Anne Smith : anne-smith"
        - "-- Not Listed / Write-in --"
        - "Other"
        - "TAs"
        - "NA"


  - type: dropdown
    id: update_strategy
    attributes:
      label: "Update Strategy"
      description: "How should existing files in the target lab directory be handled? Choose whether to keep other existing files in the directory (updating any uploaded files only) or wipe all files out and keep only the newly uploaded ones."
      options:
        - "Keep existing files and replace uploaded ones(default)"
        - "Delete existing files and replace completely"
    validations:
      required: true
      
      
      
  - type: markdown
    attributes:
      value: |
        ## Lab Tutorial 
        Here you can upload the actual tutorial itself. You have two options for where the tutorial lives:
        ### in `moledata` 
        Here you can select to upload the tutorial itself (ideally as a markdown file).
        If a markdown, we will convert it into an html on the website with a nice uniform layout for traversing all the tutorial contents.
        The file will be saved as README.md in the lab directory.
        
        If you select this option, in following textbox you should either input the tutorial text directly or upload a markdown file with the contents of the lab.
        
        ### hosted offsite 
        If you prefer that the tutorial itself is hosted off-site (e.g., a personal repo, on a specific software's website, etc.), you may select this option.
        For ease of archiving, reproducibility, computing interactions, and standardization, we do not recommend this option.
        
        If you select this option, in the following textbox you should input the link to the tutorial page.

  - type: dropdown
    id: tutorial_type
    attributes:
      label: "Tutorial page"
      description: "Where is the primary tutorial text going to live?"
      options:
        - "I want to upload it to the MOLE site"
        - "It is externally hosted and I will provide a link to the materials"
    validations:
      required: true

  - type: textarea
    id: lab_readme
    attributes:
      label: "Lab Content"
      description: "The primary contents for the lab. Either upload a markdown file (or directly input the text) if storing onsite or provide a link if using an offsite tutorial."
      placeholder: |
        # Lab Overview
        In this lab, we will explore network inference methods...
    validations:
      required: false


  - type: markdown
    attributes:
      value: |
        ### Tutorial Materials
        In the following prompts you will upload all nessecary data, scripts, and files that students will use in the labs. These are the materials that will appear on student machines.


  - type: textarea
    id: master_archive
    attributes:
      label: "Master Lab Archive (.zip, .tar.gz)"
      description: "Drop a single compressed archive containing your structured folders (scripts/, data/, outputs/, etc.). This will unpack directly into the lab directory. If lab materials are uploaded this way, you may leave the following prompts for individual folders blank"
      placeholder: "Drag and drop a master .zip archive here..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Individual Folder uploads
        Only upload contents here if you did not upload a zipped archive to the "Master Lab Archive"
        

  - type: textarea
    id: lab_scripts
    attributes:
      label: "Scripts & Code Files"
      description: "Drag and drop script files here. (Will go into a `scripts/` folder). If certain file types are not permitted, you may zip the entire contents that would go into the folder and place the zipped archive here."
      placeholder: "Drag and drop your script files here..."
    validations:
      required: false

  - type: textarea
    id: lab_data
    attributes:
      label: "Datasets & Input Files"
      description: "Drag and drop input data files. (Will go into a `data/` folder). If certain file types are not permitted, you may zip the entire contents that would go into the folder and place the zipped archive here."
      placeholder: "Drag and drop your dataset files here..."
    validations:
      required: false

  - type: textarea
    id: lab_outputs
    attributes:
      label: "Output Files & Expected Results"
      description: "Drag and drop expected outputs, trees, or result logs if applicable. (Will go into an `outputs/` folder). If certain file types are not permitted, you may zip the entire contents that would go into the folder and place the zipped archive here."
      placeholder: "Drag and drop output files here..."
    validations:
      required: false

  - type: textarea
    id: lab_assets
    attributes:
      label: "Assets and Images"
      description: "Drag and drop any diagrams, pictures, or figures used in tutorials. (Will go into an `assets/` folder). If certain file types are not permitted, you may zip the entire contents that would go into the folder and place the zipped archive here."
      placeholder: "Drag and drop output files here..."
    validations:
      required: false

  - type: textarea
    id: additional_files
    attributes:
      label: "Other Materials & Attachments"
      description: "Drop any additional slides, documents, or supplementary files that don't fit above. Files uploaded here will be put in the other-materials folder."
      placeholder: "Drag and drop other files here..."
    validations:
      required: false
