name: "Lab Content Creation or Update"
description: "Submit or update lab materials, data files, and instructions for the workshop."
title: "Lab Update: [Lab Title or Topic]"
labels: ["lab-update", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### Lab Materials Update
        Use this form to add a new lab or update existing lab materials, code, or documentation. 
        An automated pull request will be generated upon submission.

  # ---------------------------------------------------------
  # SELECTION & STRATEGY
  # ---------------------------------------------------------
  - type: dropdown
    id: lab_select
    attributes:
      label: "Select Lab to Update (or choose New)"
      description: "Choose an existing lab to modify, or select New Lab to create one."
      options:
        - "-- New Lab --"
        - "intro-computer-lab: Computer introduction"
        - "alignment-lab: Sequence alignment"
        - "iqtree-lab: IQ-TREE"
        - "revbayes-gene-trees: RevBayes gene trees"
        - "divergence-time-lab: Divergence time estimation"
        - "paup-session: PAUP*"
        - "svdquartets-tutorial: Species tree estimation with SVDQuartets"
        - "network-models-tutorial: Phylogenetic network models"
        - "migrate-tutorial: Migrate"
        - "machine-learning-lab: Machine learning"
        - "paml-lab: PAML"
        - "paml-advanced-resources: PAML advanced resources"
        - "tree-updating: Tree updating"
        - "tree-comparison: Tree comparison"
        - "open-lab: Open lab / project time"

  - type: input
    id: lab_title
    attributes:
      label: "Lab Title"
      description: "Leave Blank to keep the lab name the same. Required if creating a new lab, or if you want to rename the current one."
      placeholder: "e.g., Introduction to PhyloNetworks"
    validations:
      required: false

  - type: input
    id: responsible_faculty
    attributes:
      label: "Responsible Faculty / Author"
      description: "Name of the faculty member or instructor leading this lab."
      placeholder: "e.g., Claudia Solís-Lemus"
    validations:
      required: false

  - type: dropdown
    id: update_strategy
    attributes:
      label: "Update Strategy"
      description: "How should existing files in the target lab directory be handled?"
      options:
        - "Peter Beerli : peter-beerli"
        - "Joseph Bielawski : joseph-bielawski"
        - "Jeremy Brown : jeremy-brown"
        - "Belinda Chang : belinda-chang"
        - "Scott Edwards : scott-edwards"
        - "Laura Eme : laura-eme"
        - "Mandev Gill : mandev-gill"
        - "Tracy Heath : tracy-heath"
        - "Lacey Knowles : lacey-knowles"
        - "Laura Kubatko : laura-kubatko"
        - "Emily Jane McTavish : emily-jane-mctavish"
        - "Corrie Moreau : corrie-moreau"
        - "Claudia Solís-Lemus : claudia-solis-lemus"
        - "Megan Smith : megan-smith"
        - "David Swofford : david-swofford"
        - "Rosana Zenil-Ferguson : rosana-zenil-ferguson"
        - "Joshua Justison : joshua-justison"
        - "Analisa Milkey : analisa-milkey"
        - "Solomon McShea : solomon-mcshea"
        - "Thao Nguyen : thao-nguyen"
        - "Anne Smith : anne-smith"
        - "-- Not Listed / Write-in --"
        - "Other"
        - "TAs"
        - "NA"

  - type: textarea
    id: lab_readme
    attributes:
      label: "Lab README Content (Markdown)"
      description: "The primary instructions or overview text for the lab. This will be saved as README.md in the lab directory."
      placeholder: |
        # Lab Overview
        In this lab, we will explore network inference methods...
    validations:
      required: false

  # ---------------------------------------------------------
  # LAB FILES & ATTACHMENTS
  # ---------------------------------------------------------
  - type: textarea
    id: lab_materials
    attributes:
      label: "Primary Lab Document / Notebook"
      description: "Drag and drop a primary file (like an RMarkdown, Jupyter Notebook, PDF, or script) directly here."
      placeholder: "Drag and drop your file here..."
    validations:
      required: false

  - type: textarea
    id: additional_files
    attributes:
      label: "Additional Data Files & Attachments"
      description: "Drop any supplementary datasets, alignment files, or extra scripts needed for the lab."
      placeholder: "Drag and drop additional files here..."
    validations:
      required: false