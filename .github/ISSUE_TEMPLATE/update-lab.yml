name: "Lab Content Creation or Update"
description: "Submit or update lab materials, data files, and instructions for the workshop."
title: "Lab Update: [Lab Title or Topic]"
labels: ["lab-update", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### Lab Materials Update
        Use this form to add a new lab or update existing lab materials, code, or documentation. 
        An automated pull request will be generated upon submission.

  # ---------------------------------------------------------
  # SELECTION & STRATEGY
  # ---------------------------------------------------------
  
  ### File Attachments & Uploads

Please ensure any uploaded files thru this issue template use a github [accepted](https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/attaching-files) format. 

* **Unsupported Formats:** If your file type is not directly accepted, please **zip the archive (.zip)** before attaching it to this issue.
 Alternatively, if the file is already on GitHub, you can directly provide a link to the 'raw' file.
 For example, if you wanted to upload the R file contained here `https://github.com/trayc7/MidwestPhylo2019/blob/master/docs/class/diversification/1.general_diversification.R`, you would add a line in the text box like this [myfile.R](https://raw.githubusercontent.com/trayc7/MidwestPhylo2019/refs/heads/master/docs/class/diversification/1.general_diversification.R).
  
  - type: dropdown
    id: lab_select
    attributes:
      label: "Select Lab to Update (or choose New)"
      description: "Choose an existing lab to modify, or select New Lab to create one."
      options:
        - "-- New Lab --"
        - "intro-computer-lab: Computer introduction"
        - "alignment-lab: Sequence alignment"
        - "iqtree-lab: IQ-TREE"
        - "revbayes-gene-trees: RevBayes gene trees"
        - "divergence-time-lab: Divergence time estimation"
        - "paup-session: PAUP*"
        - "svdquartets-tutorial: Species tree estimation with SVDQuartets"
        - "network-models-tutorial: Phylogenetic network models"
        - "migrate-tutorial: Migrate"
        - "machine-learning-lab: Machine learning"
        - "paml-lab: PAML"
        - "paml-advanced-resources: PAML advanced resources"
        - "tree-updating: Tree updating"
        - "tree-comparison: Tree comparison"
        - "open-lab: Open lab / project time"

  - type: input
    id: lab_title
    attributes:
      label: "Lab Title"
      description: "Leave Blank to keep the lab name the same. Required if creating a new lab, or if you want to rename the current one."
      placeholder: "e.g., Introduction to PhyloNetworks"
    validations:
      required: false

  - type: dropdown
    id: lecturer
    attributes:
      label: "Responsible Faculty / Author"
      description: "Name of the faculty member or instructor leading this lab."
      options: 
        - "Peter Beerli : peter-beerli"
        - "Joseph Bielawski : joseph-bielawski"
        - "Jeremy Brown : jeremy-brown"
        - "Belinda Chang : belinda-chang"
        - "Scott Edwards : scott-edwards"
        - "Laura Eme : laura-eme"
        - "Mandev Gill : mandev-gill"
        - "Tracy Heath : tracy-heath"
        - "Lacey Knowles : lacey-knowles"
        - "Laura Kubatko : laura-kubatko"
        - "Emily Jane McTavish : emily-jane-mctavish"
        - "Corrie Moreau : corrie-moreau"
        - "Claudia Solís-Lemus : claudia-solis-lemus"
        - "Megan Smith : megan-smith"
        - "David Swofford : david-swofford"
        - "Rosana Zenil-Ferguson : rosana-zenil-ferguson"
        - "Joshua Justison : joshua-justison"
        - "Analisa Milkey : analisa-milkey"
        - "Solomon McShea : solomon-mcshea"
        - "Thao Nguyen : thao-nguyen"
        - "Anne Smith : anne-smith"
        - "-- Not Listed / Write-in --"
        - "Other"
        - "TAs"
        - "NA"


  - type: dropdown
    id: update_strategy
    attributes:
      label: "Update Strategy"
      description: "How should existing files in the target lab directory be handled?"
      options:
        - "Keep existing files (default)"
        - "Delete existing files and replace completely"

  - type: textarea
    id: lab_readme
    attributes:
      label: "Lab README Content (Markdown)"
      description: "The primary instructions or overview text for the lab. This will be saved as README.md in the lab directory."
      placeholder: |
        # Lab Overview
        In this lab, we will explore network inference methods...
    validations:
      required: false

  # ---------------------------------------------------------
  # LAB FILES & ATTACHMENTS
  # ---------------------------------------------------------
  - type: textarea
    id: master_archive
    attributes:
      label: "Master Lab Archive (.zip, .tar.gz)"
      description: "Optionally drop a single compressed archive containing your structured folders (scripts/, data/, outputs/, etc.). This will unpack directly into the lab directory. If lab materials are uploaded this way, you may leave the following prompts blank"
      placeholder: "Drag and drop a master .zip archive here..."
    validations:
      required: false

  - type: textarea
    id: lab_installation
    attributes:
      label: "Installation & Dependencies"
      description: "List files needed in installation.md. Optionally include a bash script installation.sh that has the commands for installation."
      placeholder: "Drag and drop your script files here..."
    validations:
      required: false

  # ---------------------------------------------------------
  # SCRIPTS & CODE
  # ---------------------------------------------------------
  - type: textarea
    id: lab_scripts
    attributes:
      label: "Scripts & Code Files"
      description: "Drag and drop script files (.jl, .R, .py, .sh) or paste script content here. (Will go into a `scripts/` folder)."
      placeholder: "Drag and drop your script files here..."
    validations:
      required: false

  # ---------------------------------------------------------
  # DATA FILES
  # ---------------------------------------------------------
  - type: textarea
    id: lab_data
    attributes:
      label: "Datasets & Input Files"
      description: "Drag and drop input data files (e.g., fasta, csv, nwk, nexus). (Will go into a `data/` folder)."
      placeholder: "Drag and drop your dataset files here..."
    validations:
      required: false

  # ---------------------------------------------------------
  # OUTPUTS / EXPECTED RESULTS
  # ---------------------------------------------------------
  - type: textarea
    id: lab_outputs
    attributes:
      label: "Output Files & Expected Results"
      description: "Drag and drop expected outputs, trees, or result logs if applicable. (Will go into an `outputs/` folder)."
      placeholder: "Drag and drop output files here..."
    validations:
      required: false

  # ---------------------------------------------------------
  # OTHER MATERIALS
  # ---------------------------------------------------------
  - type: textarea
    id: additional_files
    attributes:
      label: "Other Materials & Attachments"
      description: "Drop any additional slides, documents, or supplementary files that don't fit above."
      placeholder: "Drag and drop other files here..."
    validations: