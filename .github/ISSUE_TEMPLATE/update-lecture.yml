name: Update Lecture Materials
description: Submit or update a lecture title, README description, and supplementary files.
title: "Lecture Update: [insert descriptive name here]"
labels: ["lecture-update", "needs-review"]
body:

  - type: markdown
    attributes:
      value: |
        ### Lecture Materials Update
        Use this form to add a new lecture or update existing lecture materials. 
        An automated pull request will be generated upon submission.

  - type: dropdown
    id: select_lecture
    attributes:
      label: Select Lecture to Update (or choose New)
      description: Choose an existing lecture (item_id:title) from the course schedule, or select the option to create a new one.
      options:
        - "-- New Lecture --"
        - "intro-phylogenetics: Introduction to phylogenetics"
        - "scientific-ethics: Scientific ethics"
        - "intro-likelihood: Introduction to likelihood"
        - "likelihood-phylogenetics: Likelihood in phylogenetics"
        - "phylogenetic-models: Phylogenetic models"
        - "bayesian-inference-intro: Introduction to Bayesian inference"
        - "model-selection: Model selection"
        - "bayesian-phylogenetics: Bayesian phylogenetics"
        - "iqtree-intro: Introduction to IQ-TREE"
        - "revbayes-graphical-models: RevBayes graphical models"
        - "divergence-time-estimation: Divergence time estimation"
        - "coalescent-intro: Introduction to the coalescent"
        - "coalescent-extending: Extending the coalescent"
        - "species-tree-estimation: Species tree estimation"
        - "reticulate-evolution-networks: Reticulate evolution and phylogenetic networks"
        - "migrate-bayesfactor: Migrate and Bayes factors"
        - "ant-phylogenomics-1: Ant phylogenomics I"
        - "ant-phylogenomics-2: Ant phylogenomics II"
        - "science-under-pressure: Science under pressure"
        - "theories-molecular-evolution: Theories of molecular evolution"
        - "codon-models-intro: Introduction to codon models"
        - "adaptive-protein-intro: Adaptive protein evolution I"
        - "adaptive-protein-selection: Adaptive protein evolution II"
        - "machine-learning: Machine learning in molecular evolution"
        - "phylodynamics-1: Phylodynamics I"
        - "phylodynamics-2: Phylodynamics II"
        - "phylogeography: Phylogeography"
        - "pangenomes: Pangenomes and comparative genomics"
        - "deep-phylogenomics: Deep phylogenomics"
        - "phylogenomics: Phylogenomics"
        - "open-tree-of-life: Open Tree of Life"
        - "evolutionary-applications: Evolutionary applications of genomic data"
        - "ethics-panel-discussion: Ethics panel discussion"

  - type: input
    id: lecture_name
    attributes:
      label: Lecture Title
      description: Update the title or provide a name if this is a new lecture. Leave blank if the selected lecture title is sufficient. If creating/updating the title, a new `item_id` will be generated by slugifying the title, if possible.
      placeholder: Leave blank if lecture name selected above is adequate.
    validations:
      required: false

  - type: dropdown
    id: lecturer
    attributes:
      label: Responsible Faculty
      description: Select the faculty member responsible for this lecture.
      options:
        - "Peter Beerli : peter-beerli"
        - "Joseph Bielawski : joseph-bielawski"
        - "Jeremy Brown : jeremy-brown"
        - "Belinda Chang : belinda-chang"
        - "Scott Edwards : scott-edwards"
        - "Laura Eme : laura-eme"
        - "Mandev Gill : mandev-gill"
        - "Tracy Heath : tracy-heath"
        - "Lacey Knowles : lacey-knowles"
        - "Laura Kubatko : laura-kubatko"
        - "Emily Jane McTavish : emily-jane-mctavish"
        - "Corrie Moreau : corrie-moreau"
        - "Claudia Solís-Lemus : claudia-solis-lemus"
        - "Megan Smith : megan-smith"
        - "David Swofford : david-swofford"
        - "Rosana Zenil-Ferguson : rosana-zenil-ferguson"
        - "Joshua Justison : joshua-justison"
        - "Analisa Milkey : analisa-milkey"
        - "Solomon McShea : solomon-mcshea"
        - "Thao Nguyen : thao-nguyen"
        - "Anne Smith : anne-smith"
        - "Other"
        - "TAs"
        - "NA"






  - type: dropdown
    id: update_strategy
    attributes:
      label: Update Strategy
      description: Choose whether to keep other existing files in the directory (updating any uploaded files only) or wipe all files out and keep only the newly uploaded ones.
      options:
        - Keep existing files (default)
        - Delete existing files and replace with new uploads only
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### File Attachments & Uploads

        * **Unsupported Formats:** 
        Please ensure any uploaded files through this issue template use a GitHub [accepted](https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/attaching-files) format. 
        Alternatively, you can get around the restriction if the file is already on GitHub, you can directly provide a link to the 'raw' file.
        For example, if you wanted to upload the R file contained here `https://github.com/trayc7/MidwestPhylo2019/blob/master/docs/class/diversification/1.general_diversification.R`, you would add a line in the text box like this `[myfile.R](https://raw.githubusercontent.com/trayc7/MidwestPhylo2019/refs/heads/master/docs/class/diversification/1.general_diversification.R)`.

        * **File Sizes:** If using the using direct upload or drag and drop, only files of 25MB are accepted. Either compress files, upload them elsewhere and provide a direct download link (e.g., as above or uploading to dropbox/gogole drive), or use git from the terminal to add the desired file to the PR created from this issue.

  - type: textarea
    id: lecture_readme
    attributes:
      label: Lecture README
      description: This is an optional (but encouraged) README to include information about the lecture, learning objectives, additional readings, etc. In the future, this may be used as a landing page from the links in the schedule. For the time being, this page will not be linked to and only present in the directory itself.
      placeholder: |
        # Lecture Overview
        
        Write your notes, objectives, or markdown description here, or drag and drop a README.md file...
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Lab Tutorial 
        Here you can upload the actual tutorial itself. You have two options for where the tutorial lives:
        ### in `moledata` 
        Here you can select to upload the tutorial itself (ideally as a markdown file).
        If a markdown, we will convert it into an html on the website with a nice uniform layout for traversing all the tutorial contents.
        The file will be saved as README.md in the lab directory.
        
        If you select this option, in following textbox you should either input the tutorial text directly or upload a markdown file with the contents of the lab.
        
        ### hosted offsite 
        If you prefer that the presentation itself is hosted off-site (e.g., a personal repo, on Figshare, etc.), you may select this option.
        For ease of archiving, reproducibility, computing interactions, and standardization, we do not recommend this option.
        
        If you select this option, in the following textbox you should input the link to the presentation.

  - type: dropdown
    id: lecture_type
    attributes:
      label: "Lecture Location"
      description: "Where is the primary presentation going to live?"
      options:
        - "I want to upload it to the MOLE site"
        - "It is externally hosted and I will provide a link to the presentation"
    validations:
      required: true


  - type: textarea
    id: lecture_presentation
    attributes:
      label: Lecture Presentation / Material
      description: Drag and drop a presentation PDF directly into this box (stored on-site), OR paste a direct URL to an off-site material (e.g., Google Slides or external link). If uploading a file, it always gets saved as `item_id`.pdf (see above).
      placeholder: "Drag and drop your PDF here or paste an off-site URL..."
    validations:
      required: false

  - type: textarea
    id: lecture_files
    attributes:
      label: Additional Lecture Files & Attachments
      description: Drag and drop supplementary files (code scripts, data archives, etc.) directly into this box. Supplementary files will be stored in the same directory as the lecture. These files we be present on the site but no automatic links are made.
      placeholder: "Drag and drop your code, data, or other supplementary files here..."
    validations:
      required: false
