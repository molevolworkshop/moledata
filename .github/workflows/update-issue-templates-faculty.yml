name: "Update Issue Templates - Faculty"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [faculty-registry-updated]

concurrency:
  group: update-issue-templates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Checkout External Faculty Repository
        uses: actions/checkout@v4
        with:
          repository: 'molevolworkshop/molevolworkshop.github.io' 
          path: 'molevolworkshop.github.io'

      - name: Update Faculty Options in Both Templates
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const facultyCsvPath = path.join('molevolworkshop.github.io', '_data', 'faculty-registry.csv');

            // Parse faculty-registry.csv using 'name' and 'ID' columns
            const facultyOptions = [];
            if (fs.existsSync(facultyCsvPath)) {
              const fileContent = fs.readFileSync(facultyCsvPath, 'utf8');
              const lines = fileContent.split(/\r?\n/);
              if (lines.length > 0) {
                const headers = lines[0].split(',').map(h => h.trim().replace(/['"]/g, ''));
                const nameIndex = headers.indexOf('name');
                const idIndex = headers.indexOf('ID');
                
                if (nameIndex !== -1) {
                  for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                    const name = cols[nameIndex];
                    const id = idIndex !== -1 ? cols[idIndex] : '';
                    
                    if (name) {
                      const formattedOption = id ? `${name} : ${id}` : name;
                      if (!facultyOptions.includes(formattedOption)) {
                        facultyOptions.push(formattedOption);
                      }
                    }
                  }
                }
              }
            }

            // Define targets and their corresponding field IDs and defaults
            const targets = [
              { 
                path: '.github/ISSUE_TEMPLATE/update-lecture.yml', 
                fieldId: 'lecturer', 
                defaults: ['Other', 'TAs', 'NA'] 
              },
              { 
                path: '.github/ISSUE_TEMPLATE/update-lab.yml', 
                fieldId: 'responsible_faculty', 
                defaults: ['-- Not Listed / Write-in --', 'Other', 'TAs', 'NA'] 
              }
            ];

            targets.forEach(target => {
              if (!fs.existsSync(target.path)) {
                console.log(`Template not found: ${target.path}, skipping.`);
                return;
              }

              // Copy options and add target-specific defaults
              const currentOptions = [...facultyOptions];
              target.defaults.forEach(defOpt => {
                if (!currentOptions.includes(defOpt)) {
                  currentOptions.push(defOpt);
                }
              });

              let templateContent = fs.readFileSync(target.path, 'utf8');
              const optionsYaml = currentOptions.map(opt => `        - "${opt}"`).join('\n');

              const regex = new RegExp(`(    id: ${target.fieldId}[\\s\\S]*?      options:\\n)([\\s\\S]*?)(?=\\n  - type:|$)`);

              if (regex.test(templateContent)) {
                templateContent = templateContent.replace(regex, `$1${optionsYaml}\n`);
                fs.writeFileSync(target.path, templateContent, 'utf8');
                console.log(`Successfully updated ${target.fieldId} options in ${target.path}`);
              } else {
                console.log(`Could not locate field ID '${target.fieldId}' in ${target.path}`);
              }
            });

      - name: Commit and Push Changes if Templates Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          
          git add .github/ISSUE_TEMPLATE/update-lecture.yml .github/ISSUE_TEMPLATE/update-lab.yml
          
          if git diff --staged --quiet; then
            echo "No changes to the issue templates required."
          else
            git commit -m "chore: auto-update faculty dropdown options in lecture and lab templates"
            git push
          fi