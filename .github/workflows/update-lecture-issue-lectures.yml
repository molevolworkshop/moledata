name: Update Lecture Issue Template - Lecture

on:
  push:
    paths:
      - '_data/materials-registry.csv'
  workflow_dispatch:

concurrency:
  group: update-materials-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-template:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Lecture Options
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const templatePath = '.github/ISSUE_TEMPLATE/update-lecture.yml';
            const csvPath = '_data/materials-registry.csv';

            // 1. Parse CSV to build lecture options (excluding labs)
            const options = ['-- New Lecture --'];
            if (fs.existsSync(csvPath)) {
              const fileContent = fs.readFileSync(csvPath, 'utf8');
              const lines = fileContent.split(/\r?\n/);
              if (lines.length > 0) {
                const headers = lines[0].split(',').map(h => h.trim().replace(/['"]/g, ''));
                const idIndex = headers.indexOf('item_id');
                const titleIndex = headers.indexOf('title');
                const categoryIndex = headers.indexOf('category');

                if (idIndex !== -1 && titleIndex !== -1) {
                  for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                    const itemId = cols[idIndex];
                    const title = cols[titleIndex];
                    const category = categoryIndex !== -1 ? cols[categoryIndex] : 'lecture';

                    // Only include if it has an ID, a title, and is a lecture
                    if (itemId && title && category === 'lecture') {
                      options.push(`${itemId}: ${title}`);
                    }
                  }
                }
              }
            }

            let templateContent = fs.readFileSync(templatePath, 'utf8');
            const optionsYaml = options.map(opt => `        - "${opt}"`).join('\n');

            // Match options section under id: select_lecture using regex
            const regex = /(    id: select_lecture[\s\S]*?      options:\n)([\s\S]*?)(?=\n  - type:|$)/;
            
            if (regex.test(templateContent)) {
              templateContent = templateContent.replace(regex, `$1${optionsYaml}\n`);
              fs.writeFileSync(templatePath, templateContent, 'utf8');
              console.log('Successfully updated lecture template options (excluding labs).');
            } else {
              core.setFailed('Could not locate select_lecture options block in the template.');
            }

      - name: Commit and Push Changes if Template Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          
          git add .github/ISSUE_TEMPLATE/update-lecture.yml
          
          if git diff --staged --quiet; then
            echo "No changes to the issue template required."
          else
            git commit -m "chore: auto-update lecture options from materials registry (excluding labs)"
            git push
          fi