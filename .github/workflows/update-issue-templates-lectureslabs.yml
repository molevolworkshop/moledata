name: "Update Issue Templates - Lectures/Labs"

on:
  push:
    paths:
      - '_data/materials-registry.csv'
  workflow_dispatch:

concurrency:
  group: update-issue-templates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Lecture and Lab Options from Registry
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const csvPath = '_data/materials-registry.csv';

            const lectureOptions = ['-- New Lecture --'];
            const labOptions = ['-- New Lab --'];

            // Parse CSV and separate items by category
            if (fs.existsSync(csvPath)) {
              const fileContent = fs.readFileSync(csvPath, 'utf8');
              const lines = fileContent.split(/\r?\n/);
              if (lines.length > 0) {
                const headers = lines[0].split(',').map(h => h.trim().replace(/['"]/g, ''));
                const idIndex = headers.indexOf('item_id');
                const titleIndex = headers.indexOf('title');
                const categoryIndex = headers.indexOf('category');

                if (idIndex !== -1 && titleIndex !== -1) {
                  for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                    const itemId = cols[idIndex];
                    const title = cols[titleIndex];
                    const category = categoryIndex !== -1 ? cols[categoryIndex].toLowerCase() : 'lecture';

                    if (itemId && title) {
                      const formattedOpt = `${itemId}: ${title}`;
                      if (category === 'lab') {
                        if (!labOptions.includes(formattedOpt)) {
                          labOptions.push(formattedOpt);
                        }
                      } else {
                        // Defaults to lecture if category is 'lecture' or unspecified
                        if (!lectureOptions.includes(formattedOpt)) {
                          lectureOptions.push(formattedOpt);
                        }
                      }
                    }
                  }
                }
              }
            }

            // Target configurations for both templates
            const targets = [
              {
                path: '.github/ISSUE_TEMPLATE/update-lecture.yml',
                fieldId: 'select_lecture',
                options: lectureOptions,
                name: 'lecture'
              },
              {
                path: '.github/ISSUE_TEMPLATE/update-lab.yml',
                fieldId: 'lab_select',
                options: labOptions,
                name: 'lab'
              }
            ];

            targets.forEach(target => {
              if (!fs.existsSync(target.path)) {
                console.log(`Template not found: ${target.path}, skipping.`);
                return;
              }

              let templateContent = fs.readFileSync(target.path, 'utf8');
              const optionsYaml = target.options.map(opt => `        - "${opt}"`).join('\n');

              const regex = new RegExp(`(    id: ${target.fieldId}[\\s\\S]*?      options:\\n)([\\s\\S]*?)(?=\\n  - type:|$)`);

              if (regex.test(templateContent)) {
                templateContent = templateContent.replace(regex, `$1${optionsYaml}\n`);
                fs.writeFileSync(target.path, templateContent, 'utf8');
                console.log(`Successfully updated ${target.name} template options.`);
              } else {
                console.log(`Could not locate field ID '${target.fieldId}' in ${target.path}`);
              }
            });

      - name: Commit and Push Changes if Templates Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          
          git add .github/ISSUE_TEMPLATE/update-lecture.yml .github/ISSUE_TEMPLATE/update-lab.yml
          
          if git diff --staged --quiet; then
            echo "No changes to the issue templates required."
          else
            git commit -m "chore: auto-update lecture and lab options from materials-registry.csv"
            git push
          fi